services:
  vikunja:
    image: vikunja/vikunja:2.5.0
    environment:
      VIKUNJA_SERVICE_PUBLICURL: http://dietpi:3456/
      VIKUNJA_SERVICE_SECRET: ${VIKUNJA_SERVICE_SECRET}
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
    ports:
      - 3456:3456
    volumes:
      - /mnt/seagate_hdd/vikunja/files:/app/vikunja/files
      - /mnt/seagate_hdd/vikunja/db:/db
    restart: unless-stopped
